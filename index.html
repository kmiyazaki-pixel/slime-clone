<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>スライム自作</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/battle.css">
<link rel="stylesheet" href="styles/ui.css">
</head>
<body>
<div id="app">

  <!-- ========= 1. 上部ステータスバー ========= -->
  <header class="top-bar">
    <div class="player-badge">
      <div class="player-crown"></div>
      <div class="player-lv" id="playerLv">1</div>
    </div>
    <div class="currency gold-display">
      <div class="currency-icon coin-icon"></div>
      <span id="goldDisplay">0</span>
    </div>
    <div class="currency gem-display">
      <div class="currency-icon gem-icon"></div>
      <span id="gemDisplay">0</span>
    </div>
    <div class="top-actions">
      <button class="top-btn video-btn"><span>×2</span></button>
      <button class="top-btn mail-btn"></button>
      <button class="top-btn settings-btn">
        <span class="auth-login-dot" id="authLoginDot" hidden></span>
      </button>
    </div>
  </header>

  <!-- ========= 2. 戦場 ========= -->
  <div class="battlefield" id="battlefield" data-world="1">

    <!-- 背景スクロール: 遠景 (丘) と近景 (草・石) の2層 -->
    <div class="scroll-far"></div>
    <div class="scroll-near"></div>

    <!-- 放置タイマー (左上) -->
    <div class="idle-card">
      <div class="idle-card-icon"></div>
      <div class="idle-card-bar"></div>
      <div class="idle-card-time" id="idleTimer">00:00:00</div>
    </div>

    <!-- ステージ表示 (中央上) -->
    <div class="stage-banner" id="stageBanner">
      <div class="stage-bar-wrap">
        <div class="stage-bar" id="stageProgressBar"></div>
      </div>
      <div class="stage-name-pill" id="stageLabel">STAGE 1-1</div>
      <div class="stage-progress-mini" id="stageProgressText">0 / 5</div>
    </div>

    <!-- クエストカード (右上) -->
    <div class="quest-card">
      <div class="quest-head">クエスト 1</div>
      <div class="quest-body">ステージを<br>クリアする</div>
      <div class="quest-reward">
        <div class="quest-reward-icon"></div>
        <span>100</span>
      </div>
    </div>

    <!-- 左側スキルカラム (見た目だけ) -->
    <aside class="side-skills">
      <button class="side-skill ss-1"></button>
      <button class="side-skill ss-2"></button>
      <button class="side-skill ss-3"></button>
    </aside>

    <!-- 空の天体 (太陽/月、ワールドごとに色変化) -->
    <div class="sky-sun"></div>

    <!-- プレイヤー (data-slime-type で色を切替) -->
    <div class="slime-ground-shadow"></div>
    <div class="slime" id="slime" data-slime-type="green">
      <div class="slime-shine"></div>
      <div class="slime-mouth"></div>
    </div>

    <!-- ボスタイマー (中央上、ボス戦中のみ表示) -->
    <div class="boss-timer" id="bossTimer" hidden>
      <div class="boss-timer-label">BOSS</div>
      <div class="boss-timer-bar-wrap">
        <div class="boss-timer-bar" id="bossTimerBar"></div>
      </div>
      <div class="boss-timer-text" id="bossTimerText">30</div>
    </div>

    <!-- ボス出現警告フラッシュ -->
    <div class="boss-warning" id="bossWarning" hidden>BOSS!!</div>

    <!-- ボス再挑戦ボタン (画面右の浮きボタン) -->
    <button class="boss-retry-btn" id="bossRetryBtn" hidden>BOSS<br>再挑戦</button>
  </div>

  <!-- ========= 3. アクションバー (円形ボタン横並び) ========= -->
  <div class="action-bar">
    <button class="action-btn auto-toggle" id="autoToggle">
      <span class="auto-text">AUTO<br>ON</span>
    </button>
    <button class="action-btn skill-btn" data-skill="chargeShot">
      <span class="skill-icon">💥</span>
      <span class="skill-cd"></span>
    </button>
    <button class="action-btn skill-btn" data-skill="meteor">
      <span class="skill-icon">☄</span>
      <span class="skill-cd"></span>
    </button>
    <button class="action-btn skill-btn" data-skill="critTime">
      <span class="skill-icon">⭐</span>
      <span class="skill-cd"></span>
    </button>
    <button class="action-btn skill-btn" data-skill="goldRush">
      <span class="skill-icon">💰</span>
      <span class="skill-cd"></span>
    </button>
    <!-- 5番目: 将来のスキル追加用に確保 (今は空ロック、タップでスキルページへ誘導) -->
    <button class="action-btn skill-btn locked" data-skill-empty="true"></button>
  </div>

  <!-- ========= 4a. 強化パネル (forge タブ) ========= -->
  <section class="upgrade-panel" id="upgradePanel">
    <div class="upgrade-currency-row">
      <div class="up-currency">
        <div class="up-currency-icon"></div>
        <span id="upgradeGold">0</span>
      </div>
    </div>
    <div class="upgrades" id="upgrades"></div>
  </section>

  <!-- ========= 4d. スキルパネル (dungeon タブ = 真ん中) ========= -->
  <section class="skill-panel" id="skillPanel" hidden>
    <div class="upgrade-currency-row">
      <div class="up-currency">
        <div class="up-currency-icon"></div>
        <span id="skillPanelGold">0</span>
      </div>
    </div>
    <div class="pet-panel-header">
      <div class="pet-panel-title">スキル</div>
      <div class="pet-panel-count" id="skillPanelCount">0 / 4</div>
    </div>
    <div class="pet-grid" id="skillGrid"></div>
  </section>

  <!-- ========= 4c. スライムパネル (hero タブ = 左端) ========= -->
  <section class="slime-panel" id="slimePanel" hidden>
    <div class="upgrade-currency-row">
      <div class="up-currency">
        <div class="up-currency-icon"></div>
        <span id="slimePanelGold">0</span>
      </div>
    </div>
    <div class="pet-panel-header">
      <div class="pet-panel-title">スライム</div>
      <div class="pet-panel-count" id="slimePanelCount">1 / 5</div>
    </div>
    <div class="pet-grid" id="slimeGrid"></div>
  </section>

  <!-- ========= 4b. ペットパネル (pet タブ) ========= -->
  <section class="pet-panel" id="petPanel" hidden>
    <div class="upgrade-currency-row">
      <div class="up-currency">
        <div class="up-currency-icon"></div>
        <span id="petPanelGold">0</span>
      </div>
    </div>
    <div class="pet-panel-header">
      <div class="pet-panel-title">ペット</div>
      <div class="pet-panel-count" id="petPanelCount">0 / 4</div>
    </div>
    <div class="pet-grid" id="petGrid"></div>
  </section>

  <!-- ========= 放置報酬モーダル ========= -->
  <div class="idle-modal" id="idleModal" hidden>
    <div class="idle-modal-bg" id="idleModalBg"></div>
    <div class="idle-modal-card">
      <div class="idle-modal-emoji">💤</div>
      <div class="idle-modal-title">おかえり!</div>
      <div class="idle-modal-text">
        不在中の獲得ゴールド<br>
        <span class="idle-modal-elapsed" id="idleModalElapsed">0時間 0分</span>
      </div>
      <div class="idle-modal-cap" id="idleModalCapMsg" hidden>(上限8時間に到達)</div>
      <div class="idle-modal-reward">
        <div class="idle-modal-coin"></div>
        <div class="idle-modal-gold" id="idleModalGold">0</div>
      </div>
      <button class="idle-modal-claim" id="idleModalClaimBtn">受け取る</button>
    </div>
  </div>

  <!-- ========= クラウド/ログインモーダル ========= -->
  <div class="auth-modal" id="authModal" hidden>
    <div class="auth-modal-bg" id="authModalBg"></div>
    <div class="auth-modal-card">
      <div class="auth-modal-title">クラウドセーブ</div>

      <!-- 未ログイン -->
      <div class="auth-section" id="authSignedOut">
        <p class="auth-help">
          メールアドレスでログインすると、別の端末でも同じ進捗で遊べます。<br>
          ログインしなくてもこの端末では遊べます。
        </p>
        <input type="email" id="authEmailInput" placeholder="you@example.com" autocomplete="email">
        <button class="auth-btn auth-primary" id="authSendBtn">ログインリンクを送信</button>
        <div class="auth-status" id="authStatus"></div>
      </div>

      <!-- ログイン済み -->
      <div class="auth-section" id="authSignedIn" hidden>
        <p class="auth-help">ログイン中:</p>
        <p class="auth-email-display" id="authEmailDisplay"></p>
        <button class="auth-btn auth-secondary" id="authSyncBtn">今すぐ同期</button>
        <button class="auth-btn auth-danger" id="authLogoutBtn">ログアウト</button>
      </div>

      <button class="auth-close" id="authCloseBtn">閉じる</button>
    </div>
  </div>

  <!-- ========= 5. 下部ナビゲーション ========= -->
  <nav class="bottom-nav">
    <button class="nav-btn" data-tab="hero">
      <div class="nav-icon nav-hero"></div>
    </button>
    <button class="nav-btn" data-tab="pet">
      <div class="nav-icon nav-pet"></div>
    </button>
    <button class="nav-btn" data-tab="dungeon">
      <div class="nav-icon nav-dungeon"></div>
    </button>
    <button class="nav-btn active" data-tab="forge">
      <div class="nav-icon nav-forge"></div>
    </button>
    <button class="nav-btn" data-tab="shop">
      <div class="nav-icon nav-shop"></div>
      <div class="nav-dot"></div>
    </button>
  </nav>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
